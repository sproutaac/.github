<!doctype html><html><head><meta charset="utf-8">
<!-- Source for social/og-image-1200x630.png (sproutaac.org link previews).
     Render at 1200x630 with a headless browser; see brand/README.md. -->
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;color:#fff;font-family:'DM Sans',system-ui,sans-serif;
 background:
  radial-gradient(420px 340px at 80% 30%, rgba(168,240,192,.72), rgba(168,240,192,0) 70%),
  radial-gradient(320px 260px at 4% 108%, rgba(168,240,192,.40), rgba(168,240,192,0) 70%),
  linear-gradient(160deg,#0F5C2E 0%,#17773d 55%,#1A8C45 100%);}
.wrap{position:absolute;inset:0;padding:0 90px;display:flex;align-items:center;gap:56px}
.text{flex:1}
.aac{display:inline-block;margin-bottom:14px;padding:5px 16px;border-radius:999px;background:#A8F0C0;color:#0F5C2E;font-weight:700;font-size:22px;letter-spacing:2.5px}
h1{font-family:'Lora',Georgia,serif;font-weight:700;font-size:132px;line-height:.95;letter-spacing:-.5px}
.tag{font-family:'Lora',Georgia,serif;font-weight:600;font-size:46px;line-height:1.15;margin-top:22px}
.tag b{color:#A8F0C0;font-weight:700}
.sub{margin-top:18px;font-size:26px;opacity:.92}
.url{display:inline-block;margin-top:28px;padding:9px 22px;border-radius:999px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);font-weight:500;font-size:22px;letter-spacing:.5px}
.mark{height:330px;flex:none;filter:drop-shadow(0 0 1.5px rgba(198,248,214,.95)) drop-shadow(0 0 14px rgba(168,240,192,.55)) drop-shadow(0 0 48px rgba(168,240,192,.35))}
</style></head><body><div class="wrap">
<div class="text">
  <span class="aac">AAC</span>
  <h1>Sprout</h1>
  <div class="tag"><b>Free communication</b><br>for every child.</div>
  <div class="sub">No subscription. No paywall. Forever.</div>
  <span class="url">sproutaac.org</span>
</div>
<img class="mark" src="../../sprout-mark.svg" alt="">
</div></body></html>
