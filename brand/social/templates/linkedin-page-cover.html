<!doctype html><html><head><meta charset="utf-8">
<!-- Source for social/linkedin-page-cover-1128x191.png. Render at 1128x191 (2x). -->
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1128px;height:191px;overflow:hidden;position:relative;color:#fff;font-family:'DM Sans',system-ui,sans-serif;
 background:
  radial-gradient(260px 200px at 84% 28%, rgba(168,240,192,.72), rgba(168,240,192,0) 70%),
  radial-gradient(180px 140px at 6% 112%, rgba(168,240,192,.4), rgba(168,240,192,0) 70%),

.wrap{position:absolute;left:290px;right:40px;top:0;bottom:0;display:flex;align-items:center;gap:24px}
.mark{height:118px;flex:none;filter:drop-shadow(0 0 1px rgba(198,248,214,.95)) drop-shadow(0 0 10px rgba(168,240,192,.5))}

.tag b{color:#A8F0C0;font-weight:700}
.sub{margin-top:8px;font-size:16px;opacity:.92}
</style></head><body><div class="wrap">
<img class="mark" src="../../sprout-mark.svg" alt=""><h1>Sprout</h1><div class="bar"></div>
